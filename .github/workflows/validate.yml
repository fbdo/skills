name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v5
      - name: Spec validation (skills-ref)
        run: |
          for dir in skills/*/; do
            uvx --from "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref" skills-ref validate "$dir"
          done
      - name: Portability, manifest sync and private-detail denylist
        run: node .github/scripts/check-repo.mjs
      - name: Marketplace manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate .
      - name: Script tests
        run: node --test skills/*/scripts/*.test.mjs
